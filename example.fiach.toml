[daemon]
repos = ["owner/repo"]
interval = 100
provider = "openrouter" # Options: openrouter, anthropic, openai, google
model = "google/gemini-3.1-pro-preview"
# Optional: defaults to provider/model above when unset
# verifier_provider = "openrouter"
# verifier_model = "anthropic/claude-sonnet-4"
pr_state = ["open", "merged"] # Options: "open", "merged", "closed", "all" (can also be a comma-separated string)
# filter_by_updated = false # Omit the updated:>= filter; default is true
# updated_within_days = 120 # Used only when filter_by_updated = true
# trigger_mention = "fiach-bot" # Only review PRs after this GitHub user is @-mentioned; each mention triggers one review, re-mention to re-review
# allowed_mention_users = ["lead-maintainer"] # Usernames whose mentions count; defaults to commenters matching allowed_author_associations
skip_prs = ["1870"] # Skip specific PR numbers globally or per repo
allowed_author_associations = ["COLLABORATOR", "CONTRIBUTOR", "MEMBER", "OWNER"]
max_workers = 1 # Shared polling/manual worker limit; queue capacity is max(2 * max_workers, 16); 0 means unlimited
drafts = false # Set to true to also review draft PRs
out_dir = "reports" # Local directory to store reports
report_mode = "sync-pr" # Options: local, pr-comment, sync-pr
sync_repo = "thesimplekid/cdk-reviews" # GitHub repo to sync to if report_mode = "sync-pr"
notify_on_empty = false
# review_start_reaction = "eyes" # Default GitHub PR reaction when review starts
# no_findings_reaction = "+1" # Default GitHub PR reaction when review completes with no findings
verify_findings = true # Run a verifier pass before disclosure when findings are present
max_turns = 300
# persona = "builtin:pr-review" # Single persona; default is builtin:security
# personas = ["builtin:pr-review", "builtin:security"] # Run independent passes for each PR
# review_lanes = ["correctness", "concurrency", "api-compat", "tests"] # Focused subagent lanes inside one persona review
# max_review_lanes = 2 # Maximum lane subagents to run concurrently inside each review
# sandbox_rootfs = "/nix/store/...-fiach-sandbox-rootfs" # Usually generated by the NixOS module
# sandbox_network = "bridge" # Options: host, bridge, private, veth
# with_skill = "rust-security" # Load a specific domain skill

# Post one PR-summary root message for general reviews and one reply per
# verifier-approved finding. Security reviews with findings are routed to the
# restricted channel as a separate thread. Configuring Buzz automatically adds
# the built-in `summary` review lane.
#
# The host process must have FIACH_BUZZ_PRIVATE_KEY set. Fiach uses the
# embedded Buzz client; the review sandbox never receives this key.
# [daemon.buzz]
# relay_url = "https://buzz.example.com"
# public_channel = "00000000-0000-0000-0000-000000000001"
# security_channel = "00000000-0000-0000-0000-000000000002"
# private_key_env = "FIACH_BUZZ_PRIVATE_KEY"
# auth_tag_env = "FIACH_BUZZ_AUTH_TAG"
#
# Answer questions when this same Buzz identity is cryptographically tagged in
# a Fiach review thread. Provider/model default to the daemon finder settings.
# Empty allowed_pubkeys accepts any member who can post in the channel.
# [daemon.buzz.questions]
# enabled = true
# provider = "openrouter"
# model = "openai/gpt-5-mini"
# allowed_pubkeys = ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]
# max_question_bytes = 4096
# timeout_secs = 120

# [daemon.review_lane_prompts]
# cashu-mint = """
# Focus on Cashu mint correctness:
# - quote idempotency
# - blinded signature issuance
# - keyset transitions
# - accounting invariants
# Only report concrete PR-introduced issues.
# """

[review]
provider = "openrouter"
model = "google/gemini-3.1-pro-preview"
# Optional: defaults to provider/model above when unset
# verifier_provider = "openrouter"
# verifier_model = "anthropic/claude-sonnet-4"
max_turns = 60
timeout_mins = 30
report_mode = "sync-pr"
sync_repo = "thesimplekid/cdk-reviews"
notify_on_empty = false
# review_start_reaction = "eyes"
# no_findings_reaction = "+1"
verify_findings = true
# persona = "builtin:pr-review" # Single persona; default is builtin:security
# personas = ["builtin:pr-review", "builtin:security"] # Run independent passes for this PR
# review_lanes = ["correctness", "concurrency", "api-compat", "tests"]
# max_review_lanes = 2
# max_cost_usd = 5.0

# [review.buzz]
# relay_url = "https://buzz.example.com"
# public_channel = "00000000-0000-0000-0000-000000000001"
# security_channel = "00000000-0000-0000-0000-000000000002"

# [review.review_lane_prompts]
# cashu-mint = "Focus on Cashu mint correctness, quote idempotency, and accounting invariants."

# Optional: Define additional context repositories to clone into the temporary workspace alongside the target PR
# [context_groups."owner/repo"]
# repos = ["owner/another-repo"]
