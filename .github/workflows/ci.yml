name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust checks
    runs-on: rith-nix
    steps:
      - uses: actions/checkout@v4
      # rith-nix supplies Nix and the Attic substituters/keys through NixOS.
      - name: Show Nix caches
        run: nix config show substituters
      - name: Rust checks
        run: nix develop --command just check

  flake-checks:
    name: Flake checks
    runs-on: rith-nix
    steps:
      - uses: actions/checkout@v4
      # rith-nix supplies Nix and the Attic substituters/keys through NixOS.
      - name: Show Nix caches
        run: nix config show substituters
      - name: Flake checks
        run: nix flake check --no-write-lock-file -L
