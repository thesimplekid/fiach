name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust checks
    runs-on: rith-nix
    steps:
      - uses: actions/checkout@v4
      # rith-nix supplies Nix and the Attic substituters/keys through NixOS.
      - name: Show Nix caches
        run: nix config show substituters
      - name: Rust checks
        run: nix develop --profile "$RUNNER_TEMP/fiach-dev-shell" --command just check
      - name: Push development shell to Attic
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          readlink -f "$RUNNER_TEMP/fiach-dev-shell" |
            nix shell .#attic-client --command bash scripts/ci-attic-push.sh

  flake-checks:
    name: Flake checks
    runs-on: rith-nix
    steps:
      - uses: actions/checkout@v4
      # rith-nix supplies Nix and the Attic substituters/keys through NixOS.
      - name: Show Nix caches
        run: nix config show substituters
      - name: Flake checks
        run: nix flake check --no-write-lock-file -L
      - name: Push flake checks to Attic
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix eval --raw ".#checks.$system" \
            --apply 'checks: builtins.concatStringsSep "\n" (map (check: check.outPath) (builtins.attrValues checks)) + "\n"' \
            > "$RUNNER_TEMP/fiach-check-paths"
          nix shell .#attic-client --command bash scripts/ci-attic-push.sh \
            < "$RUNNER_TEMP/fiach-check-paths"
