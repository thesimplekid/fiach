[package]
name = "fiach"
version = "0.1.0"
edition = "2024"

[dependencies]
goose = { git = "https://github.com/aaif-goose/goose", tag = "v1.44.0", default-features = false, features = ["rustls-tls"] }
buzz-client = { git = "https://github.com/thesimplekid/buzz", rev = "151317f568c9ffef63886db7051ad5966bffcd59" }
buzz-sdk = { git = "https://github.com/thesimplekid/buzz", rev = "151317f568c9ffef63886db7051ad5966bffcd59" }
nostr = "0.44"
uuid = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
dotenvy = "0.15"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = "1.2.0"
tokio-util = "0.7.18"
redb = "4"
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3.27.0"
config = { version = "0.15.22", features = ["toml"] }
axum = "0.8.9"
tower-http = { version = "0.6.8", features = ["trace"] }
