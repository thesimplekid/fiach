[package]
name = "fiach"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[dependencies]
goose = { git = "https://github.com/aaif-goose/goose", tag = "v1.50.1", default-features = false, features = ["rustls-tls"] }
jev-sdk = "=0.1.0"
buzz-client = { git = "https://github.com/thesimplekid/buzz", rev = "151317f568c9ffef63886db7051ad5966bffcd59" }
buzz-sdk = { git = "https://github.com/thesimplekid/buzz", rev = "151317f568c9ffef63886db7051ad5966bffcd59" }
nostr = "0.44"
uuid = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
dotenvy = "0.15"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = "3.4.0"
tokio-util = "0.7.19"
redb = "4"
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3.27.0"
config = { version = "0.15.25", features = ["toml"] }
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["trace"] }

[target.'cfg(unix)'.dependencies]
# Goose 1.50.1 uses ProcessSession but relied on RMCP to enable this feature.
# RMCP 3.3+ uses process-wrap 10, so enable it explicitly for Goose's version.
process-wrap = { version = "9", default-features = false, features = ["std", "process-session"] }
